[build]
  command = "npx playwright install chromium && npm run build"
  publish = "dist"
  image = "ubuntu:24.04"

[build.environment]
  NODE_VERSION = "20"
  NIXPACKS_NIX_VERSION = "2.19.3"

# SPA fallback only when the file does not exist.
# Do not use force=true — that rewrites sitemap.xml and robots.txt to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  framework = "vite"
